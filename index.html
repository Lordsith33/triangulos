<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos de Apuntes 4º ESO</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        .balance { font-size: 2.5em; color: #333; margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>

<div class="box" id="login-box">
    <h2>Buscador de Temas</h2>
    <p>Introduce tu ID de Estudiante:</p>
    <input type="text" id="user-id" placeholder="Ej: P7X2">
    <button onclick="login()">ACCEDER</button>
</div>

<div class="box hidden" id="main-box">
    <h3>Hola, <span id="user-name"></span></h3>
    <div class="balance"><span id="user-balance">0</span> Δ</div>
    <hr>
    <h4>Transferir Créditos</h4>
    <input type="text" id="dest-id" placeholder="ID del compañero">
    <input type="number" id="amount" placeholder="Cantidad Δ">
    <button onclick="transferir()">ENVIAR</button>
    <p id="msg" style="color: green; margin-top: 10px;"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBKYhc7yd_rzuaalZSOuu8ER7QMD1PW-cA",
    authDomain: "banco-triangulos.firebaseapp.com",
    projectId: "banco-triangulos",
    storageBucket: "banco-triangulos.firebasestorage.app",
    messagingSenderId: "694080442853",
    appId: "1:694080442853:web:2fe514cecf9800bbe69f0c"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  let currentUserId = "";

  async function login() {
    const id = document.getElementById('user-id').value.toUpperCase();
    const userDoc = await db.collection("usuarios").doc(id).get();
    if (userDoc.exists) {
        currentUserId = id;
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('main-box').classList.remove('hidden');
        document.getElementById('user-name').innerText = userDoc.data().nombre;
        db.collection("usuarios").doc(currentUserId).onSnapshot((doc) => {
            document.getElementById('user-balance').innerText = doc.data().saldo;
        });
    } else { alert("ID no encontrado."); }
  }

  async function transferir() {
    const destId = document.getElementById('dest-id').value.toUpperCase();
    const cant = parseInt(document.getElementById('amount').value);
    if (!destId || isNaN(cant) || cant <= 0) return;

    const userRef = db.collection("usuarios").doc(currentUserId);
    const destRef = db.collection("usuarios").doc(destId);

    try {
        await db.runTransaction(async (t) => {
            const uDoc = await t.get(userRef);
            const dDoc = await t.get(destRef);
            if (!dDoc.exists) throw "Destinatario no existe";
            if (uDoc.data().saldo < cant) throw "Saldo insuficiente";
            t.update(userRef, { saldo: uDoc.data().saldo - cant });
            t.update(destRef, { saldo: dDoc.data().saldo + cant });
        });
        document.getElementById('msg').innerText = "¡Enviado!";
        setTimeout(() => document.getElementById('msg').innerText = "", 3000);
    } catch (e) { alert("Error: " + e); }
  }
</script>
</body>
</html>
