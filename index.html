<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Δ CAPITAL">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/e/ec/Regular_triangle.svg"> 
    <title>Δ CAPITAL</title>
    <style>
        :root { --gold: #d4af37; --bg-dark: #121212; --bg-card: #1e1e1e; --text: #eaeaea; --sub-text: #aaaaaa; --admin: #51cf66; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text); margin: 0; display: flex; justify-content: center; padding: 20px; box-sizing: border-box; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; }
        .box { background: var(--bg-card); padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        h2 { color: var(--gold); margin: 0; font-weight: 800; letter-spacing: 2px; }
        input { width: 100%; padding: 16px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; background: #000; color: #fff; font-size: 16px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 16px; background: var(--gold); color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; }
        .balance { font-size: 4em; font-weight: 900; margin: 5px 0; color: #fff; letter-spacing: -2px; }
        .hidden { display: none; }
        .history-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #333; font-size: 0.85em; }
        .admin-tag { font-size: 10px; background: var(--admin); color: #000; padding: 2px 6px; border-radius: 4px; vertical-align: middle; margin-left: 5px; }
        .admin-box { border: 1px dashed var(--admin) !important; background: #0f1a12 !important; }
        .success { color: #51cf66; font-weight: bold; } .error { color: #ff6b6b; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="box" id="login-box">
        <h2 style="margin-bottom:10px">Δ CAPITAL</h2>
        <p style="color:var(--sub-text); font-size:0.8em">PORTAL FINANCIERO PRIVADO</p>
        <input type="password" id="access-id" placeholder="CÓDIGO DE ACCESO">
        <button onclick="login()">ENTRAR</button>
    </div>

    <div class="box admin-box hidden" id="admin-panel">
        <h3 style="color:var(--admin); margin:0; font-size: 0.8em;">CONTROL CENTRAL DE MERCADO</h3>
        <input type="number" id="admin-amount" placeholder="CANTIDAD A INYECTAR">
        <button onclick="injectMoney()" style="background:var(--admin); margin-bottom: 10px;">GENERAR TRIÁNGULOS</button>
        <button onclick="toggleMarket()" id="btn-freeze" style="background:#ff6b6b; font-size: 12px; padding: 10px;">BLOQUEAR OTRAS CUENTAS</button>
    </div>

    <div class="box hidden" id="main-box">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <span id="user-name" style="font-weight:bold; color:var(--gold)"></span>
            <span id="public-id-display" style="font-size:0.8em; opacity:0.7"></span>
        </div>
        <p style="font-size: 0.7em; letter-spacing: 3px; color: var(--sub-text); margin-top: 20px;">SALDO DISPONIBLE</p>
        <div class="balance"><span id="user-balance">0</span><small style="font-size:0.4em"> Δ</small></div>
        <input type="text" id="dest-public-id" placeholder="ID PÚBLICO DESTINARIO">
        <input type="number" id="amount" placeholder="CANTIDAD Δ">
        <button onclick="transferir()" id="btn-send">CONFIRMAR ENVÍO</button>
        <p id="msg"></p>
    </div>

    <div class="box admin-box hidden" id="market-monitor">
        <h4 style="color:var(--admin); margin:0 0 10px 0; font-size:0.8em; text-align: left;">ESCANER DE TRANSACCIONES GLOBALES</h4>
        <div id="all-history-list" style="text-align:left; font-size: 0.7em;"></div>
    </div>

    <div class="box hidden" id="history-box" style="text-align:left">
        <h4 style="color:var(--gold); margin:0 0 15px 0; font-size:0.8em; letter-spacing:1px">TUS MOVIMIENTOS</h4>
        <div id="history-list"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBKYhc7yd_rzuaalZSOuu8ER7QMD1PW-cA",
    authDomain: "banco-triangulos.firebaseapp.com",
    projectId: "banco-triangulos",
    storageBucket: "banco-triangulos.firebasestorage.app",
    messagingSenderId: "694080442853",
    appId: "1:694080442853:web:2fe514cecf9800bbe69f0c"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  let myDocId = ""; 
  let myPublicPin = "";
  let isAdmin = false;

  async function login() {
    const idEntrada = document.getElementById('access-id').value.trim();
    if (!idEntrada) return;
    
    // Activar privilegios si es LS33
    if(idEntrada.toUpperCase() === "LS33") isAdmin = true;

    try {
        const userDoc = await db.collection("usuarios").doc(idEntrada).get();
        if (userDoc.exists) {
            myDocId = idEntrada;
            myPublicPin = userDoc.data().pin;
            
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('main-box').classList.remove('hidden');
            document.getElementById('history-box').classList.remove('hidden');
            
            // Mostrar paneles admin si corresponde
            if(isAdmin) {
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('market-monitor').classList.remove('hidden');
                document.getElementById('user-name').innerHTML = userDoc.data().nombre.toUpperCase() + ' <span class="admin-tag">ADMIN</span>';
                cargarMonitorGlobal();
            } else {
                document.getElementById('user-name').innerText = userDoc.data().nombre.toUpperCase();
            }

            document.getElementById('public-id-display').innerText = "ID: " + myPublicPin;
            db.collection("usuarios").doc(myDocId).onSnapshot(doc => {
                if(doc.exists) document.getElementById('user-balance').innerText = doc.data().saldo;
            });
            cargarHistorial();
        } else { alert("CÓDIGO INVÁLIDO"); }
    } catch (e) { alert("ERROR DE CONEXIÓN"); }
  }

  // FUNCIÓN ESPECIAL LS33: Inyectar dinero
  async function injectMoney() {
    const cant = parseInt(document.getElementById('admin-amount').value);
    if(isNaN(cant) || cant <= 0) return;
    try {
        const ref = db.collection("usuarios").doc(myDocId);
        const doc = await ref.get();
        await ref.update({ saldo: doc.data().saldo + cant });
        alert("INYECTADOS " + cant + " Δ CORRECTAMENTE");
        document.getElementById('admin-amount').value = "";
    } catch (e) { alert("Error inyectando capital"); }
  }

  // FUNCIÓN ESPECIAL LS33: Bloquear mercado (Simulado)
  function toggleMarket() {
      const btn = document.getElementById('btn-freeze');
      if(btn.innerText.includes("BLOQUEAR")) {
          btn.innerText = "MERCADO INHABILITADO";
          btn.style.background = "#fff";
          alert("Has congelado las operaciones externas.");
      } else {
          btn.innerText = "BLOQUEAR OTRAS CUENTAS";
          btn.style.background = "#ff6b6b";
          alert("Mercado rehabilitado.");
      }
  }

  // FUNCIÓN ESPECIAL LS33: Monitor global
  function cargarMonitorGlobal() {
      db.collection("transferencias").orderBy("fecha", "desc").limit(15).onSnapshot(snap => {
          const monitor = document.getElementById('all-history-list');
          monitor.innerHTML = "";
          snap.forEach(doc => {
              const t = doc.data();
              monitor.innerHTML += `<div style="padding:4px 0; border-bottom:1px solid #222">
                  <span style="color:var(--admin)">${t.de}</span> → 
                  <span style="color:var(--gold)">${t.para}</span>: 
                  <b>${t.cantidad} Δ</b></div>`;
          });
      });
  }

  async function transferir() {
    const targetPin = document.getElementById('dest-public-id').value.trim().toUpperCase();
    const cant = parseInt(document.getElementById('amount').value);
    const msg = document.getElementById('msg');
    if (!targetPin || isNaN(cant) || cant <= 0) return;
    
    document.getElementById('btn-send').disabled = true;
    msg.innerText = "PROCESANDO...";

    try {
        const snapshot = await db.collection("usuarios").where("pin", "==", targetPin).get();
        if (snapshot.empty) throw "ID NO EXISTE";
        const destDoc = snapshot.docs[0];
        const myRef = db.collection("usuarios").doc(myDocId);

        await db.runTransaction(async (t) => {
            const me = await t.get(myRef);
            if (me.data().pin.toUpperCase() === targetPin) throw "OPERACIÓN INVÁLIDA";
            if (me.data().saldo < cant) throw "SALDO INSUFICIENTE";
            t.update(myRef, { saldo: me.data().saldo - cant });
            t.update(destDoc.ref, { saldo: destDoc.data().saldo + cant });
            t.set(db.collection("transferencias").doc(), {
                de: myPublicPin, para: targetPin, cantidad: cant, fecha: Date.now()
            });
        });
        msg.className = "success";
        msg.innerText = "ENVÍO COMPLETADO";
        document.getElementById('amount').value = "";
    } catch (e) { msg.className = "error"; msg.innerText = e; } 
    finally { document.getElementById('btn-send').disabled = false; }
  }

  function cargarHistorial() {
    db.collection("transferencias").limit(20).onSnapshot(snap => {
        const list = document.getElementById('history-list');
        let docs = [];
        snap.forEach(doc => {
            const d = doc.data();
            if (d.de === myPublicPin || d.para === myPublicPin) docs.push(d);
        });
        docs.sort((a, b) => b.fecha - a.fecha);
        list.innerHTML = "";
        docs.forEach(t => {
            const soyYo = t.de === myPublicPin;
            list.innerHTML += `<div class="history-item">
                <span>${soyYo ? 'A: ' + t.para : 'DE: ' + t.de}</span>
                <span class="${soyYo ? 'error' : 'success'}">${soyYo ? '-' : '+'}${t.cantidad} Δ</span>
            </div>`;
        });
    });
  }
</script>
</body>
</html>
    <div class="box" id="login-box">
        <h2 style="margin-bottom:10px">Δ CAPITAL</h2>
        <p style="color:var(--sub-text); font-size:0.8em">PORTAL FINANCIERO PRIVADO</p>
        <input type="password" id="access-id" placeholder="CÓDIGO DE ACCESO">
        <button onclick="login()">ENTRAR</button>
    </div>

    <div class="box hidden" id="main-box">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <span id="user-name" style="font-weight:bold; color:var(--gold)"></span>
            <span id="public-id-display" style="font-size:0.8em; opacity:0.7"></span>
        </div>
        
        <p class="balance-label">SALDO DISPONIBLE</p>
        <div class="balance"><span id="user-balance">0</span><small style="font-size:0.4em"> Δ</small></div>
        
        <input type="text" id="dest-public-id" placeholder="ID PÚBLICO DESTINARIO">
        <input type="number" id="amount" placeholder="CANTIDAD Δ">
        <button onclick="transferir()" id="btn-send">CONFIRMAR ENVÍO</button>
        <p id="msg"></p>
    </div>

    <div class="box hidden" id="history-box" style="text-align:left">
        <h4 style="color:var(--gold); margin:0 0 15px 0; font-size:0.8em; letter-spacing:1px">ÚLTIMOS MOVIMIENTOS</h4>
        <div id="history-list">
            <p style="text-align:center; color:var(--sub-text); font-size:0.8em">Cargando...</p>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBKYhc7yd_rzuaalZSOuu8ER7QMD1PW-cA",
    authDomain: "banco-triangulos.firebaseapp.com",
    projectId: "banco-triangulos",
    storageBucket: "banco-triangulos.firebasestorage.app",
    messagingSenderId: "694080442853",
    appId: "1:694080442853:web:2fe514cecf9800bbe69f0c"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  let myDocId = ""; 
  let myPublicPin = "";

  async function login() {
    const idEntrada = document.getElementById('access-id').value.trim();
    if (!idEntrada) return;
    try {
        const userDoc = await db.collection("usuarios").doc(idEntrada).get();
        if (userDoc.exists) {
            myDocId = idEntrada;
            const data = userDoc.data();
            myPublicPin = data.pin;
            
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('main-box').classList.remove('hidden');
            document.getElementById('history-box').classList.remove('hidden');
            
            document.getElementById('user-name').innerText = data.nombre.toUpperCase();
            document.getElementById('public-id-display').innerText = "ID: " + myPublicPin;
            
            db.collection("usuarios").doc(myDocId).onSnapshot(doc => {
                if(doc.exists) document.getElementById('user-balance').innerText = doc.data().saldo;
            });
            
            cargarHistorial();
        } else { alert("CÓDIGO INVÁLIDO"); }
    } catch (e) { alert("ERROR DE CONEXIÓN"); }
  }

  async function transferir() {
    const targetPin = document.getElementById('dest-public-id').value.trim().toUpperCase();
    const cant = parseInt(document.getElementById('amount').value);
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn-send');

    if (!targetPin || isNaN(cant) || cant <= 0) return;
    btn.disabled = true;
    msg.innerText = "PROCESANDO...";

    try {
        const snapshot = await db.collection("usuarios").where("pin", "==", targetPin).get();
        if (snapshot.empty) throw "ID NO EXISTE";
        
        const destDoc = snapshot.docs[0];
        const myRef = db.collection("usuarios").doc(myDocId);

        await db.runTransaction(async (t) => {
            const me = await t.get(myRef);
            if (me.data().pin.toUpperCase() === targetPin) throw "OPERACIÓN NO PERMITIDA";
            if (me.data().saldo < cant) throw "FONDOS INSUFICIENTES";
            
            t.update(myRef, { saldo: me.data().saldo - cant });
            t.update(destDoc.ref, { saldo: destDoc.data().saldo + cant });
            
            t.set(db.collection("transferencias").doc(), {
                de: myPublicPin,
                para: targetPin,
                cantidad: cant,
                fecha: Date.now()
            });
        });

        msg.className = "success";
        msg.innerText = "TRANSACCIÓN COMPLETADA";
        document.getElementById('dest-public-id').value = "";
        document.getElementById('amount').value = "";
    } catch (e) {
        msg.className = "error";
        msg.innerText = e;
    } finally {
        btn.disabled = false;
        setTimeout(() => msg.innerText = "", 3000);
    }
  }

  function cargarHistorial() {
    db.collection("transferencias").limit(30).onSnapshot(snap => {
        const list = document.getElementById('history-list');
        let misMovimientos = [];
        
        snap.forEach(doc => {
            const t = doc.data();
            if (t.de === myPublicPin || t.para === myPublicPin) {
                misMovimientos.push(t);
            }
        });

        misMovimientos.sort((a, b) => b.fecha - a.fecha);

        list.innerHTML = "";
        if (misMovimientos.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:var(--sub-text); font-size:0.8em">SIN ACTIVIDAD.</p>';
            return;
        }

        misMovimientos.forEach(t => {
            const soyYo = t.de === myPublicPin;
            list.innerHTML += `
                <div class="history-item">
                    <span>${soyYo ? 'A: ' + t.para : 'DE: ' + t.de}</span>
                    <span class="${soyYo ? 'error' : 'success'}">${soyYo ? '-' : '+'}${t.cantidad} Δ</span>
                </div>`;
        });
    });
  }
</script>
</body>
</html>
