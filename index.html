<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos de Apuntes 4º ESO</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 85%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
        .balance { font-size: 2.5em; color: #333; margin: 15px 0; font-weight: bold; }
        #msg { color: #28a745; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>

<div class="box" id="login-box">
    <h2>Acceso Seguro</h2>
    <p>Introduce tu Código de Estudiante:</p>
    <input type="password" id="access-id" placeholder="Código Privado">
    <button onclick="login()">ENTRAR</button>
</div>

<div class="box hidden" id="main-box">
    <h3>Hola, <span id="user-name"></span></h3>
    <p style="font-size: 0.9em; color: #666;">Tu ID Público para recibir: <b id="public-id-display"></b></p>
    <div class="balance"><span id="user-balance">0</span> Δ</div>
    <hr>
    <p style="font-size: 0.8em; color: #666;">Enviar a un compañero:</p>
    <input type="text" id="dest-public-id" placeholder="ID Público del destino">
    <input type="number" id="amount" placeholder="Cantidad Δ">
    <button onclick="transferir()">ENVIAR TRIÁNGULOS</button>
    <p id="msg"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBKYhc7yd_rzuaalZSOuu8ER7QMD1PW-cA",
    authDomain: "banco-triangulos.firebaseapp.com",
    projectId: "banco-triangulos",
    storageBucket: "banco-triangulos.firebasestorage.app",
    messagingSenderId: "694080442853",
    appId: "1:694080442853:web:2fe514cecf9800bbe69f0c"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  let currentDocId = ""; // El ID del documento (Privado)

  async function login() {
    const idPrivado = document.getElementById('access-id').value.toUpperCase().trim();
    const userDoc = await db.collection("usuarios").doc(idPrivado).get();
    
    if (userDoc.exists) {
        currentDocId = idPrivado;
        const datos = userDoc.data();
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('main-box').classList.remove('hidden');
        document.getElementById('user-name').innerText = datos.nombre;
        document.getElementById('public-id-display').innerText = datos.pin;
        
        db.collection("usuarios").doc(currentDocId).onSnapshot((doc) => {
            if(doc.exists) document.getElementById('user-balance').innerText = doc.data().saldo;
        });
    } else { alert("Código incorrecto o no registrado."); }
  }

  async function transferir() {
    const destPublicId = document.getElementById('dest-public-id').value.toUpperCase().trim();
    const cant = parseInt(document.getElementById('amount').value);
    const msg = document.getElementById('msg');

    if (!destPublicId || isNaN(cant) || cant <= 0) return;

    try {
        // BUSCAR AL DESTINATARIO POR SU ID PÚBLICO (campo 'pin')
        const snapshot = await db.collection("usuarios").where("pin", "==", destPublicId).get();
        
        if (snapshot.empty) { alert("El ID Público de destino no existe."); return; }
        
        const destDoc = snapshot.docs[0];
        const destRef = destDoc.ref;
        const userRef = db.collection("usuarios").doc(currentDocId);

        await db.runTransaction(async (t) => {
            const uDoc = await t.get(userRef);
            if (uDoc.data().pin === destPublicId) throw "No puedes enviarte a ti mismo";
            if (uDoc.data().saldo < cant) throw "Saldo insuficiente";
            
            t.update(userRef, { saldo: uDoc.data().saldo - cant });
            t.update(destRef, { saldo: destDoc.data().saldo + cant });
        });

        msg.innerText = "¡Enviado con éxito!";
        document.getElementById('amount').value = "";
        setTimeout(() => msg.innerText = "", 3000);
    } catch (e) { alert("Error: " + e); }
  }
</script>
</body>
</html>
