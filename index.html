<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Banco Δ">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/590/590510.png"> 
    
    <title>Banco Δ - Apuntes</title>
    
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 85%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #e0e0e0; border-radius: 12px; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .balance { font-size: 3em; color: #202124; margin: 10px 0; font-weight: 800; letter-spacing: -1px; }
        .hidden { display: none; }
        #msg { margin-top: 15px; font-weight: bold; font-size: 0.9em; min-height: 1.2em; }
        .success { color: #1e8e3e; }
        .error { color: #d93025; }
        .id-publico { background: #e8f0fe; color: var(--primary); padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: bold; }
        hr { border: 0; border-top: 1px solid #f1f1f1; margin: 20px 0; }
    </style>
</head>
<body>

<div class="box" id="login-box">
    <h2 style="margin-top:0">Δ Acceso</h2>
    <p>Introduce tu código privado de alumno</p>
    <input type="password" id="access-id" placeholder="Código Secreto">
    <button onclick="login()">ENTRAR</button>
</div>

<div class="box hidden" id="main-box">
    <p style="margin-bottom:5px">Hola, <span id="user-name" style="font-weight:bold"></span></p>
    <span class="id-publico" id="public-id-display"></span>
    <div class="balance"><span id="user-balance">0</span><small style="font-size:0.5em">Δ</small></div>
    
    <hr>
    
    <p style="margin:0"><b>Enviar a compañero</b></p>
    <input type="text" id="dest-public-id" placeholder="ID Público (Ej: GOMEZ)">
    <input type="number" id="amount" placeholder="Cantidad a enviar">
    <button onclick="transferir()" id="btn-send">REALIZAR ENVÍO</button>
    <p id="msg"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBKYhc7yd_rzuaalZSOuu8ER7QMD1PW-cA",
    authDomain: "banco-triangulos.firebaseapp.com",
    projectId: "banco-triangulos",
    storageBucket: "banco-triangulos.firebasestorage.app",
    messagingSenderId: "694080442853",
    appId: "1:694080442853:web:2fe514cecf9800bbe69f0c"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  let myDocId = ""; 

  async function login() {
    const idEntrada = document.getElementById('access-id').value.trim();
    if (!idEntrada) return;

    try {
        const userDoc = await db.collection("usuarios").doc(idEntrada).get();
        if (userDoc.exists) {
            myDocId = idEntrada;
            const data = userDoc.data();
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('main-box').classList.remove('hidden');
            document.getElementById('user-name').innerText = data.nombre;
            document.getElementById('public-id-display').innerText = "ID: " + data.pin;
            
            db.collection("usuarios").doc(myDocId).onSnapshot(doc => {
                if(doc.exists) document.getElementById('user-balance').innerText = doc.data().saldo;
            });
        } else { alert("Código incorrecto"); }
    } catch (e) { alert("Error de red"); }
  }

  async function transferir() {
    const targetPin = document.getElementById('dest-public-id').value.trim().toUpperCase();
    const cant = parseInt(document.getElementById('amount').value);
    const btn = document.getElementById('btn-send');
    const msg = document.getElementById('msg');

    if (!targetPin || isNaN(cant) || cant <= 0) return;

    btn.disabled = true;
    msg.className = "";
    msg.innerText = "Procesando...";

    try {
        const snapshot = await db.collection("usuarios").where("pin", "==", targetPin).get();
        if (snapshot.empty) throw "El ID Público no existe";
        
        const destDoc = snapshot.docs[0];
        const destRef = destDoc.ref;
        const myRef = db.collection("usuarios").doc(myDocId);

        await db.runTransaction(async (t) => {
            const me = await t.get(myRef);
            if (me.data().pin.toUpperCase() === targetPin) throw "No puedes enviarte a ti mismo";
            if (me.data().saldo < cant) throw "Saldo insuficiente";
            
            t.update(myRef, { saldo: me.data().saldo - cant });
            t.update(destRef, { saldo: destDoc.data().saldo + cant });
        });

        msg.className = "success";
        msg.innerText = "¡Enviado con éxito!";
        document.getElementById('amount').value = "";
        document.getElementById('dest-public-id').value = "";
    } catch (e) {
        msg.className = "error";
        msg.innerText = e;
    } finally {
        btn.disabled = false;
        setTimeout(() => { msg.innerText = ""; }, 4000);
    }
  }
</script>
</body>
</html>
